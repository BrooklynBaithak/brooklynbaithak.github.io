<!-- FAQ Section -->
<section id="faq" class="bb-faq">
    <div class="container">
        <div class="row">
            <div class="col-lg-12 text-center">
                <div class="bb-ornament">✦</div>
                <h2 class="section-heading">Frequently Asked Questions</h2>
                <div class="bb-divider-gold"></div>
                <h3 class="section-subheading text-muted">Everything you need to know about Brooklyn Baithak.</h3>
            </div>
        </div>
        <div class="row">
            <div class="col-lg-10 col-lg-offset-1">
                <div class="bb-faq-grid">
                    {% for item in site.data.faq %}
                    <div class="bb-faq-item">
                        <div class="bb-faq-question">
                            <i class="fa fa-question-circle bb-faq-icon"></i>
                            <h4>{{ item.question }}</h4>
                        </div>
                        <div class="bb-faq-answer">
                            <p>{{ item.answer }}</p>
                        </div>
                    </div>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>
</section>
