<!-- Story / About Section -->
<section id="story" class="bb-story">
    <div class="container">
        <div class="row">
            <div class="col-lg-12 text-center">
                <div class="bb-ornament">✦</div>
                <h2 class="section-heading">Our Story</h2>
                <div class="bb-divider-gold"></div>
                <h3 class="section-subheading text-muted">{{ site.data.story.subheading }}</h3>
            </div>
        </div>
        <div class="row">
            <div class="col-lg-12">
                <ul class="timeline">
                    {% for entry in site.data.story.timeline %}
                    <li{% if entry.inverted %} class="timeline-inverted"{% endif %}>
                        <div class="timeline-image">
                            <img class="img-circle img-responsive" src="{{ entry.image }}" alt="{{ entry.alt }}">
                        </div>
                        <div class="timeline-panel">
                            <div class="timeline-heading">
                                <h4>{{ entry.year }}</h4>
                                <h4 class="subheading">{{ entry.heading }}</h4>
                            </div>
                            <div class="timeline-body">
                                <div class="text-muted">{{ entry.body | markdownify }}</div>
                            </div>
                        </div>
                    </li>
                    {% endfor %}
                    <li class="timeline-inverted">
                        <div class="timeline-image">
                            <h4>Be Part
                                <br>Of Our
                                <br>Story!</h4>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</section>
