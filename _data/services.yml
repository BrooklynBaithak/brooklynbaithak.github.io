subheading: Brooklyn Baithak creates meaningful experiences for everyone who walks through our doors.

groups:
  - heading: For Attendees
    icon: fa-users
    featured: false
    items:
      - Intimate, living room–style concerts in Brooklyn homes and community spaces
      - Direct access to talented emerging South Asian artists
      - A welcoming, inclusive community of music lovers
      - Complimentary chai and snacks at every event
      - Q&A and meet-the-artist opportunities after performances
      - Affordable, accessible ticket pricing for all

