faq:
  - question: What is a Baithak?
    answer: >
      Baithak (बैठक) is an Urdu/Hindi word meaning "sitting room" or "gathering place."
      Historically, baithaks were intimate musical gatherings in private homes where artists
      and audiences sat together in close proximity — a tradition Brooklyn Baithak revives
      and reimagines for New York's diaspora community.

  - question: Where do events take place?
    answer: >
      Our events are hosted in intimate Brooklyn spaces — private homes, community halls, and
      cultural venues. The exact location is shared with ticket holders upon RSVP to preserve
      the intimate, exclusive nature of each gathering.

  - question: Do I need to know anything about South Asian music to enjoy a Baithak?
    answer: >
      Absolutely not! Our events welcome everyone — from lifelong classical music enthusiasts
      to complete newcomers. The intimate format naturally invites curiosity and conversation.
      Many first-time attendees tell us it was one of the most moving musical experiences
      they've ever had.

  - question: How can I apply to perform at a Baithak?
    answer: >
      We review the [open call sheet](https://docs.google.com/forms/d/1grbELIQdrH7OrKGYsE7pnwqxbf9R04k6-9vZu9xZ6ss/viewform?pli=1&edit_requested=true) and curate a balanced lineup of around 8 performance slots per event. 
      We include both first-time and returning performers and aim to stay true to the Baithak spirit, with a 
      focus on raga-based and experimental expression. Performers apply through our sign-up form. We review 
      submissions on a first-come, first-served rolling basis.  Selected artists are then contacted directly via email or Instagram with next steps.

  - question: How do I stay updated on upcoming events?
    answer: >
      Follow us on [Instagram](https://www.instagram.com/brooklynbaithak/) for all upcoming events. 

  - question: What is an emerging artist?
    answer: >
      An emerging artist is someone who is in the early stages of their musical or creative journey, 
      not necessarily a full-time professional performer, but someone developing their craft. Brooklyn 
      Baithak is designed as an incubator for these artists to build confidence, gain live performance 
      experience, and grow their audience in a supportive community setting.

  - question: Can I perform with a group?
    answer: >
      Yes. We can accommodate groups of 2-4 performers

  - question: How long are performances?
    answer: >
      Each performance is approximately 10 minutes, curated as part of a full lineup. 
      Final schedules are shared with performers a few days before the event. 

  - question: What is the audience experience like?
    answer: >
      Our events are intimate and community-focused, with floor seating in traditional baithak style, 
      along with chairs and some standing space. We aim to create a warm, listening-centered environment.

  - question: Do you record performances?
    answer: >
      We photograph and film select moments from each Baithak for Instagram and community storytelling,
      but we don't share full recordings or raw footage. Part of what makes a Baithak special is that 
      you had to be there and we want to keep it that way. That said, we love when the community shares 
      their own moments from the night. We try to reshare as much as we can.

  - question: How can I support Brooklyn Baithak?
    answer: >
      The best ways to support us are: attending events, spreading the word in your community,
      following and sharing our social media, and considering becoming a sponsor or donor.
      Corporate sponsorship and individual patronage opportunities are available — reach out
      to us to learn more.
