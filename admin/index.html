<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager</title>
  <!-- Responsive Decap CMS UI CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/hithismani/responsive-decap@main/dist/responsive.css">
  <style>
    @media (max-width: 800px) {
    /* Force the Editor and Preview Pane to stack vertically */
      .SplitPane {
        flex-direction: column !important;
      }
      .SplitPane > .Pane {
        width: 100% !important;
        max-width: 100% !important;
        position: static !important;
      }
      .SplitPane > .Pane1 {
        height: 55vh !important;
        overflow-y: auto !important;
      }
      .SplitPane > .Pane2 {
        height: 45vh !important;
      }
      .Resizer {
        display: none !important;
      }
    }
    
    /* Fullscreen preview mode for mobile */
    body.mobile-preview-expanded .SplitPane > .Pane1 {
      display: none !important;
    }
    body.mobile-preview-expanded .SplitPane > .Pane2 {
      height: 100vh !important;
    }
    
    /* Hide the native toggles */
    .tucked-toggles {
      display: none !important;
    }

    /* Mobile Dock Styling */
    .bb-mobile-dock {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      display: none;
      z-index: 10000;
      padding: 3px;
      gap: 3px;
      align-items: center;
      border: 1px solid #e2e8f0;
      backdrop-filter: blur(10px);
    }
    .bb-dock-btn {
      background: transparent;
      border: none;
      color: #4a5568;
      padding: 6px 12px;
      border-radius: 16px;
      font-weight: 600;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      transition: all 0.2s;
    }
    .bb-dock-btn:hover {
      background: #f7fafc;
      color: #c8a951;
    }
    .bb-dock-btn.active {
      background: #c8a951;
      color: white;
    }
    .bb-dock-btn i {
      font-size: 14px;
    }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      // Create Mobile Dock
      var dock = document.createElement("div");
      dock.className = "bb-mobile-dock";
      
      // Create Dock Buttons
      var btnTogglePreview = document.createElement("button");
      btnTogglePreview.innerHTML = "<i class='fa fa-eye-slash'></i> Hide Preview";
      btnTogglePreview.className = "bb-dock-btn";

      var btnExpand = document.createElement("button");
      btnExpand.innerHTML = "<i class='fa fa-expand'></i> Expand";
      btnExpand.className = "bb-dock-btn";

      dock.appendChild(btnTogglePreview);
      dock.appendChild(btnExpand);
      document.body.appendChild(dock);
      
      // Helper to click native buttons
      function clickNativeButton(titleMatch) {
        var btns = document.querySelectorAll('button');
        for (var i = 0; i < btns.length; i++) {
          var title = (btns[i].getAttribute('title') || '').toLowerCase();
          if (title.indexOf(titleMatch) !== -1) {
            btns[i].click();
            return true;
          }
        }
        return false;
      }

      // Event Listeners
      btnTogglePreview.addEventListener("click", function() {
        clickNativeButton('preview');
        if (btnTogglePreview.innerHTML.indexOf('Hide') !== -1) {
          btnTogglePreview.innerHTML = "<i class='fa fa-eye'></i> Show Preview";
          btnTogglePreview.classList.add("active");
        } else {
          btnTogglePreview.innerHTML = "<i class='fa fa-eye-slash'></i> Hide Preview";
          btnTogglePreview.classList.remove("active");
        }
      });

      var isPreviewExpanded = false;
      btnExpand.addEventListener("click", function() {
        isPreviewExpanded = !isPreviewExpanded;
        if (isPreviewExpanded) {
          btnExpand.innerHTML = "<i class='fa fa-compress'></i> Contract";
          btnExpand.classList.add("active");
          document.body.classList.add("mobile-preview-expanded");
        } else {
          btnExpand.innerHTML = "<i class='fa fa-expand'></i> Expand";
          btnExpand.classList.remove("active");
          document.body.classList.remove("mobile-preview-expanded");
        }
      });

      // Visibility Logic
      var checkWidth = function() {
        if (window.innerWidth <= 800) {
          var isEditing = false;
          var btns = document.querySelectorAll('button');
          for (var i = 0; i < btns.length; i++) {
            var title = (btns[i].getAttribute('title') || '').toLowerCase();
            if (title.indexOf('preview') !== -1) {
              isEditing = true;
              break;
            }
          }
          dock.style.display = isEditing ? "flex" : "none";
        } else {
          dock.style.display = "none";
        }
      };
      
      var hideNativeToggles = function() {
        var btns = document.querySelectorAll('button');
        var container = null;
        for (var i = 0; i < btns.length; i++) {
          var title = (btns[i].getAttribute('title') || '').toLowerCase();
          if (title.indexOf('scroll sync') !== -1 || title.indexOf('preview') !== -1) {
            if (btns[i].parentElement && btns[i].parentElement.tagName === 'DIV' && btns[i].parentElement.children.length <= 3) {
              container = btns[i].parentElement;
              break;
            }
          }
        }
        if (container && !container.classList.contains('tucked-toggles')) {
          container.classList.add('tucked-toggles');
        }
      };
      
      window.addEventListener('resize', checkWidth);
      setInterval(function() {
        checkWidth();
        hideNativeToggles();
      }, 1000);
    });
  </script>
</head>

  <!-- Include the script that builds the page and starts Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    // Register Stylesheets
    CMS.registerPreviewStyle("/style.css");
    CMS.registerPreviewStyle("/css/bb-custom.css");
    CMS.registerPreviewStyle("/css/links.css");
    CMS.registerPreviewStyle("https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css");
    CMS.registerPreviewStyle("https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css");
    CMS.registerPreviewStyle("https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Lato:wght@300;400;700&family=Montserrat:wght@400;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Droid+Serif:ital,wght@0,400;0,700;1,400;1,700&display=swap");

    // Helper function to inject viewport meta tag into preview iframe
    function injectViewport() {
      var iframe = document.querySelector('iframe');
      if (iframe && iframe.contentDocument && !iframe.contentDocument.querySelector('meta[name="viewport"]')) {
        var meta = iframe.contentDocument.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, initial-scale=1.0';
        iframe.contentDocument.head.appendChild(meta);
      }
    }

    // Define Post Preview Component
    var PostPreview = createClass({
      componentDidMount: injectViewport,
      render: function() {
        var entry = this.props.entry;
        var getAsset = this.props.getAsset;
        
        var title = entry.getIn(['data', 'title']) || '';
        var subtitle = entry.getIn(['data', 'subtitle']) || '';
        var description = entry.getIn(['data', 'description']) || '';
        var client = entry.getIn(['data', 'client']) || '';
        var projectDate = entry.getIn(['data', 'project-date']) || '';
        var category = entry.getIn(['data', 'category']) || '';
        var body = this.props.widgetFor('body');
        
        // Handle images
        var img = entry.getIn(['data', 'img']);
        var imgUrl = '';
        if (img) {
          var asset = getAsset(img);
          if (asset) {
            imgUrl = String(asset);
            // Prepend directory if it is just a filename
            if (typeof imgUrl === 'string' && !imgUrl.startsWith('/') && !imgUrl.startsWith('http') && !imgUrl.startsWith('blob:')) {
              imgUrl = '/img/portfolio/' + imgUrl;
            }
          }
        }

        return h('div', { className: 'portfolio-modal' },
          h('div', { className: 'modal-content' },
            h('div', { className: 'container' },
              h('div', { className: 'row' },
                h('div', { className: 'col-lg-8 col-lg-offset-2' },
                  h('div', { className: 'modal-body' },
                    h('h2', {}, title),
                    h('hr', { className: 'star-primary' }),
                    imgUrl ? h('img', { src: imgUrl, className: 'img-responsive img-centered', alt: entry.getIn(['data', 'alt']) || '' }) : null,
                    h('p', {}, description),
                    body ? h('div', {}, body) : null,
                    h('ul', { className: 'list-inline item-details' },
                      client ? h('li', {}, 'Client: ', h('strong', {}, client)) : null,
                      projectDate ? h('li', {}, 'Date: ', h('strong', {}, projectDate)) : null,
                      category ? h('li', {}, 'Service: ', h('strong', {}, category)) : null
                    )
                  )
                )
              )
            )
          )
        );
      }
    });

    // Register the custom preview template
    CMS.registerPreviewTemplate("posts", PostPreview);

    // Define Data Files Preview Component
    var DataPreview = createClass({
      componentDidMount: injectViewport,
      render: function() {
        var entry = this.props.entry;
        var getAsset = this.props.getAsset;
        var slug = entry.get('slug'); // Identifies the file within the collection (e.g. 'faq')
        
        if (slug === 'faq') {
          var faqList = entry.getIn(['data', 'faq']);
          var items = [];
          if (faqList) {
            faqList.forEach(function(item, index) {
              items.push(
                h('div', { className: 'bb-faq-item', key: index },
                  h('div', { className: 'bb-faq-question' },
                    h('i', { className: 'fa fa-question-circle bb-faq-icon' }),
                    h('h4', {}, item.get('question'))
                  ),
                  h('div', { className: 'bb-faq-answer' },
                    h('p', {}, item.get('answer'))
                  )
                )
              );
            });
          }
          return h('section', { id: 'faq', className: 'bb-faq' },
            h('div', { className: 'container' },
              h('div', { className: 'row' },
                h('div', { className: 'col-lg-12 text-center' },
                  h('div', { className: 'bb-ornament' }, '✦'),
                  h('h2', { className: 'section-heading' }, 'Frequently Asked Questions'),
                  h('div', { className: 'bb-divider-gold' }),
                  h('h3', { className: 'section-subheading text-muted' }, 'Everything you need to know about Brooklyn Baithak.')
                )
              ),
              h('div', { className: 'row' },
                h('div', { className: 'col-lg-10 col-lg-offset-1' },
                  h('div', { className: 'bb-faq-grid' }, items)
                )
              )
            )
          );
        } else if (slug === 'services') {
          var widgetsForGroups = this.props.widgetsFor('groups');
          var groupElements = [];
          if (widgetsForGroups) {
            widgetsForGroups.forEach(function(groupWidget, index) {
              var data = groupWidget.get('data');

              var cta = null;

                cta = h('a', { className: 'btn btn-xl btn-sm-services', href: data.get('cta_url') || '#' }, data.get('cta_text'));

              h('div', { className: 'row' },

                  h('h2', { className: 'section-heading' }, 'What We Offer'),
                  h('div', { className: 'bb-divider-gold' }),

                )

            )
          );
        } else if (slug === 'events') {
          var events = entry.getIn(['data', 'events']);
          var eventElements = [];
          if (events) {
            events.forEach(function(event, index) {

                      h('p', { className: 'bb-event-meta' }, h('i', { className: 'fa fa-clock-o' }), ' ', event.get('time')),
                      h('p', { className: 'bb-event-description' }, event.get('description')),
                      h('div', { className: 'bb-event-price' },
                        h('span', { className: 'bb-price-tag' }, event.get('price'))
                      ),
                      h('a', { className: 'btn btn-xl bb-btn-event', href: event.get('url') || '#', target: '_blank' }, 'Get Tickets')

          var imgStr = entry.getIn(['data', 'profile_image']);

            h('a', { className: 'subscribe-btn', href: '#' }, 'Subscribe'),
            h('div', { className: 'links-wrapper' }, linkElements),
            h('div', { className: 'footer' },

        } else if (slug === 'story') {

          var timelineElements = [];
          if (timeline) {

              var invertedClass = item.get('inverted') ? 'timeline-inverted' : '';
              var imgStr = item.get('image');
              var imgUrl = '';
              if (imgStr) {
                // Use the getAsset function provided in props
                var asset = getAsset ? getAsset(imgStr) : imgStr; 
                if (asset) {
                  imgUrl = String(asset);
                  if (typeof imgUrl === 'string' && !imgUrl.startsWith('/') && !imgUrl.startsWith('http') && !imgUrl.startsWith('blob:')) {
                    if (imgUrl.startsWith('img/')) {
                      imgUrl = '/' + imgUrl;
                    } else {
                      imgUrl = '/img/' + imgUrl; 
                    }
                  }
                }
              }
              timelineElements.push(
                h('li', { className: invertedClass, key: index },
                  h('div', { className: 'timeline-image' },
                    imgUrl ? h('img', { className: 'img-circle img-responsive', src: imgUrl, alt: item.get('alt') || '' }) : null
                  ),
                  h('div', { className: 'timeline-panel' },
                    h('div', { className: 'timeline-heading' },
                      h('h4', {}, item.get('year')),
                      h('h4', { className: 'subheading' }, item.get('heading'))
                    ),
                    h('div', { className: 'timeline-body' },
                      h('p', { className: 'text-muted' }, item.get('body'))
                    )
                  )
                )
              );
            });
            // Add the final capstone node
            timelineElements.push(
              h('li', { className: 'timeline-inverted', key: 'capstone' },
                h('div', { className: 'timeline-image' },
                  h('h4', {}, 'Be Part', h('br'), 'Of Our', h('br'), 'Story!')
                )
              )
            );
          }
          return h('section', { id: 'story', className: 'bb-story' },
            h('div', { className: 'container' },
              h('div', { className: 'row' },
                h('div', { className: 'col-lg-12 text-center' },
                  h('div', { className: 'bb-ornament' }, '✦'),
                  h('h2', { className: 'section-heading' }, 'Our Story'),
                  h('div', { className: 'bb-divider-gold' }),
                  h('h3', { className: 'section-subheading text-muted' }, entry.getIn(['data', 'subheading']))
                )
              ),
              h('div', { className: 'row' },
                h('div', { className: 'col-lg-12' },
                  h('ul', { className: 'timeline' }, timelineElements)
                )
              )
            )
          );
        }
        
        // Fallback for other data files that don't have a specific preview
        return h('div', { style: { padding: '2rem' } }, 
          h('h2', {}, 'No custom preview configured for ' + slug + '.'),
          h('p', {}, 'However, your data will still be saved successfully.')
        );
      }
    });

    CMS.registerPreviewTemplate("services", DataPreview);
    CMS.registerPreviewTemplate("events", DataPreview);
    CMS.registerPreviewTemplate("impact", DataPreview);
    CMS.registerPreviewTemplate("testimonials", DataPreview);
    CMS.registerPreviewTemplate("mission", DataPreview);
    CMS.registerPreviewTemplate("press", DataPreview);
    CMS.registerPreviewTemplate("story", DataPreview);
    CMS.registerPreviewTemplate("faq", DataPreview);
    CMS.registerPreviewTemplate("links", DataPreview);
    CMS.registerPreviewTemplate("data", DataPreview);
  </script>
</body>
